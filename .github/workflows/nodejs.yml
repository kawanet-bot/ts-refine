name: Node.js CI

on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 'npm install' runs 'prepare' (clean build); tests are skipped there
      # via the npm_command check in the Makefile and run explicitly next.
      - run: npm install
      - run: npm test
      - run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            *-*.*.*.tgz
            builder/consumer/
            builder/tests/
            sample/
          if-no-files-found: error
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # https://github.com/nodejs/release
        node-version: [ "18", "20", "22", "24", "26" ]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      # No checkout: installing the packed tarball into this bare directory
      # is itself the files/exports/bin/engines check on the consumer path.
      - run: npm install ./*-*.*.*.tgz --no-audit --no-fund
      - run: make -f builder/consumer/Makefile test
